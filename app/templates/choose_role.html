{% extends 'base.html' %}
{% block content %}
<h2 class="text-center my-3">{{ t('choose_title') }}</h2>
<div class="row g-4 justify-content-center">
 <div class="col-md-5">
  <a class="card role-card text-center p-4 h-100 shadow-sm" href="{{ url_for('main.choose_role', role='customer') }}">
   <i class="bi bi-house-heart-fill text-primary"></i>
   <h4 class="mt-3 mb-1">{{ t('choose_customer') }}</h4>
   <p class="text-muted mb-3">{{ t('choose_customer_sub') }}</p>
   <span class="btn btn-primary btn-lg mt-auto">{{ t('role_customer') }} <i class="bi bi-arrow-right"></i></span>
  </a>
 </div>
 <div class="col-md-5">
  <a class="card role-card text-center p-4 h-100 shadow-sm" href="{{ url_for('main.choose_role', role='worker') }}">
   <i class="bi bi-person-workspace text-success"></i>
   <h4 class="mt-3 mb-1">{{ t('choose_worker') }}</h4>
   <p class="text-muted mb-3">{{ t('choose_worker_sub') }}</p>
   <span class="btn btn-success btn-lg mt-auto">{{ t('role_worker') }} <i class="bi bi-arrow-right"></i></span>
  </a>
 </div>
</div>
{% endblock %}
