{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card card-body shadow-sm">
 <h4>{{ t('review_title') }} — {{ b.worker.user.name }}</h4>
 <form method="post">
  <label class="form-label">{{ t('rating') }}</label>
  <select name="rating" class="form-select mb-3" required>
   {% for n in [5, 4, 3, 2, 1] %}<option value="{{ n }}">{{ '★' * n }}</option>{% endfor %}</select>
  <label class="form-label">{{ t('feedback') }}</label>
  <textarea name="comment" class="form-control mb-3" rows="3" maxlength="500"></textarea>
  <button class="btn btn-primary w-100">{{ t('submit') }}</button>
 </form>
</div></div></div>
{% endblock %}
