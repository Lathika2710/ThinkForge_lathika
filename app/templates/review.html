{% extends 'base.html' %}
{% block content %}
<div class="card job card-body">
 <h4>{{ t('review_title') }} — {{ b.worker.user.name }}</h4>
 <form method="post">
  <label class="form-label">{{ t('rating') }}</label>
  <div class="d-flex gap-2 mb-3">
   {% for n in [1, 2, 3, 4, 5] %}<input type="radio" class="btn-check" name="rating" id="r{{ n }}" value="{{ n }}" required {{ 'checked' if n == 5 }}>
   <label class="btn btn-outline-warning flex-fill py-2 fs-4" for="r{{ n }}">{{ n }}★</label>{% endfor %}
  </div>
  <label class="form-label">{{ t('feedback') }}</label>
  <textarea name="comment" class="form-control mb-3" rows="3" maxlength="500"></textarea>
  <button class="btn btn-primary w-100">{{ t('submit') }}</button>
 </form>
</div>
{% endblock %}
