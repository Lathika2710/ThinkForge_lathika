{% extends 'base.html' %}
{% block content %}
<div class="card job"><div class="card-body">
 <div class="d-flex align-items-center gap-3 mb-3">
  <div class="avatar"><i class="bi bi-person-fill"></i></div>
  <div><div class="fw-bold">{{ wp.user.name }}</div><div class="small text-muted">{{ t('cat_' + wp.category.name) }}</div></div>
 </div>
 <form method="post" enctype="multipart/form-data" autocomplete="off">
  <div class="row g-2 mb-3">
   <div class="col-6"><label class="form-label">{{ t('date') }}</label><input type="date" name="date" min="{{ today }}" class="form-control form-control-lg" required value="{{ request.form.get('date', today) }}"></div>
   <div class="col-6"><label class="form-label">{{ t('time') }}</label><input type="time" name="time" class="form-control form-control-lg" required value="{{ request.form.get('time', '') }}"></div>
  </div>
  <label class="form-label">{{ t('your_offer') }}</label>
  <input type="number" name="price" min="1" max="100000" step="1" inputmode="numeric" required class="form-control form-control-lg mb-1"
         value="{{ request.form.get('price', wp.starting_price) }}">
  <div class="form-text mb-3">{{ t('price_hint', p=wp.starting_price) }}</div>
  <label class="form-label">{{ t('describe_problem') }}</label>
  <textarea name="problem" class="form-control mb-3" rows="2" maxlength="1000" required>{{ request.form.get('problem', '') }}</textarea>
  <label class="form-label">{{ t('upload_photo') }}</label>
  <input type="file" name="photo" accept="image/png,image/jpeg" class="form-control mb-3">
  <label class="form-label">{{ t('address') }}</label>
  <input name="address" class="form-control mb-3" value="{{ request.form.get('address') or g.user.address or '' }}">
  <button class="btn btn-primary btn-lg w-100">{{ t('send_request') }}</button>
 </form>
</div></div>
<div class="text-center mt-3"><a class="small text-muted" href="{{ url_for('main.workers', category=wp.category_id) }}"><i class="bi bi-arrow-left"></i> {{ t('change') }}</a></div>
{% endblock %}
